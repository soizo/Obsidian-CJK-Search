name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "$version" = "$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: (cd dist && zip -r "../cjk-search-v${VERSION}.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            "cjk-search-v${VERSION}.zip" \
            dist/main.js \
            dist/manifest.json \
            dist/LICENSE \
            dist/THIRD_PARTY_NOTICES.md \
            dist/LICENSES/*.txt \
            --target "$GITHUB_SHA" \
            --title "CJK Search v${VERSION}" \
            --generate-notes
