name: Update version

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-version:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Update version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Version must use X.Y.Z format');
          }
          const files = ['manifest.json', 'package.json', 'package-lock.json'];
          for (const file of files) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (file === 'manifest.json' && json.version === version) {
              throw new Error(`Version is already ${version}`);
            }
            json.version = version;
            if (file === 'package-lock.json') {
              json.packages[''].version = version;
            }
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }
          const file = 'src/main.js';
          const source = fs.readFileSync(file, 'utf8');
          const pattern = new RegExp(
            "^(const build = 'editor-suggestions-)\\d+\\.\\d+\\.\\d+(';)",
            'm',
          );
          const updated = source.replace(pattern, `$1${version}$2`);
          if (updated === source) {
            throw new Error('Build version marker not found');
          }
          fs.writeFileSync(file, updated);
          NODE

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json package.json package-lock.json src/main.js
          git commit -m "chore: bump version to ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
